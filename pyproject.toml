[project]
name = "skillpulse"
version = "0.1.0"
description = "Daily job-skills trend agent for India (Hyderabad first): fetch postings, classify level, extract skills, email a report."
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.27",
    "openai>=3.42.1",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
skillpulse = "skillpulse.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
