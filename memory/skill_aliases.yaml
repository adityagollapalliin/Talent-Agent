# canonical: every alias (case/punctuation-insensitive) is renamed to the canonical key.
# focus_groups: specific items that also count as a hit for a focus technology (they are NOT renamed).
#   e.g. "Pinecone" stays "Pinecone" in skill lists, but counts toward the "Vector databases" focus row.

